<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sky Drifter — CMPT 461</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000010; }

    /* Pre-scene loading overlay (plain HTML, disappears once A-Frame fires "loaded") */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #000010;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; font-family: 'Arial', sans-serif;
      transition: opacity 0.6s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    #loading-screen h1 { font-size: 2.4rem; color: #FFD700; letter-spacing: 0.15em; }
    #loading-screen p  { margin-top: 0.6rem; color: #aaddff; font-size: 1rem; }
    .loader-bar {
      margin-top: 1.4rem; width: 220px; height: 4px;
      background: #222; border-radius: 2px; overflow: hidden;
    }
    .loader-fill {
      height: 100%; width: 0%; background: #FFD700;
      border-radius: 2px;
      animation: fill 2.5s ease forwards;
    }
    @keyframes fill { to { width: 100%; } }
  </style>

  <!-- ============================================================
       DEPENDENCIES  (CDN — no build step needed)
  ============================================================ -->
  <!-- A-Frame 1.7.1 -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

  <!-- HTML loading screen (pure CSS, shown before WebGL boots) -->
  <div id="loading-screen">
    <h1>SKY DRIFTER</h1>
    <p>CMPT 461 · Trinity Western University</p>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <!-- ==============================================================
       A-FRAME SCENE
  ============================================================== -->
  <a-scene
    id="main-scene"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true; sortObjects: true"
    loading-screen="enabled: false"
    shadow="type: basic">

    <!-- ==========================================================
         ASSETS  (audio only; textures are commented — swap in
         your own files from assets/textures/ when ready)
    ========================================================== -->
    <a-assets timeout="2000">

      <!-- AUDIO ─────────────────────────────────────────────────
           Drop MP3/OGG files into assets/audio/.
           Recommended free sources:
             • freemusicarchive.org  (CC-licensed ambient tracks)
             • freesound.org         (CC SFX)
             • zapsplat.com          (free with attribution)
      -->
      <audio id="aud-music-l1"  src="assets/audio/music-day.mp3"    loop preload="auto" crossorigin="anonymous"></audio>
      <audio id="aud-music-l2"  src="assets/audio/music-dusk.mp3"   loop preload="auto" crossorigin="anonymous"></audio>
      <audio id="aud-sfx-ring"  src="assets/audio/sfx-ring.mp3"          preload="auto" crossorigin="anonymous"></audio>
      <audio id="aud-sfx-orb"   src="assets/audio/sfx-orb.mp3"           preload="auto" crossorigin="anonymous"></audio>
      <audio id="aud-sfx-cloud" src="assets/audio/sfx-cloud.mp3"         preload="auto" crossorigin="anonymous"></audio>
      <audio id="aud-sfx-level" src="assets/audio/sfx-levelup.mp3"       preload="auto" crossorigin="anonymous"></audio>

      <!-- TEXTURES ───────────────────────────────────────────────
           Once you have the files, uncomment each line and set the
           src, then reference them as e.g. src="#tex-balloon".
           Suggested free sources:
             • Poly Haven  : polyhaven.com/textures  (CC0)
             • ambientCG   : ambientcg.com           (CC0)
      -->
      <img id="tex-balloon"   src="assets/textures/balloon.png">
      <img id="tex-basket"    src="assets/textures/basket.jpg">
      <img id="tex-ring"      src="assets/textures/ring.png">
      <img id="tex-orb"       src="assets/textures/orb.png">
      <img id="tex-cloud"     src="assets/textures/cloud.png">
      <img id="tex-ground-l1" src="assets/textures/ground-meadow.jpg">
      <img id="tex-ground-l2" src="assets/textures/ground-canyon.jpg">
      <img id="tex-sky-l1"    src="assets/textures/sky-day.jpg">
      <img id="tex-sky-l2"    src="assets/textures/sky-dusk.jpg">
    </a-assets>

    <!-- ==========================================================
         SKY  (single element — color swapped on level change)
    ========================================================== -->
    <a-sky id="sky" src="#tex-sky-l1"></a-sky>

    <!-- ==========================================================
         LEVEL 1 ENVIRONMENT — Sunny Meadows
    ========================================================== -->
    <a-entity id="env-l1">
      <!-- Sunlight -->
      <a-light type="ambient"     color="#fffbe6" intensity="0.55"></a-light>
      <a-light type="directional" color="#fffbe6" intensity="0.9"
               position="1 2 -1" cast-shadow="true"></a-light>
      <!-- Ground plane (2× depth of playfield) -->
      <a-plane id="ground-l1"
               position="0 0 -300" rotation="-90 0 0"
               width="400" height="700"
               shadow="receive: true"
               material="src: #tex-ground-l1; repeat: 40 80; roughness: 1.0">
      </a-plane>
      <!-- Sun disc -->
      <a-sphere position="90 130 -250" radius="9"
                material="shader: flat; color: #FFFACD">
      </a-sphere>
      <!-- Distant rolling hills (decorative boxes) -->
      <a-box position="-120 8 -320" width="80" height="22" depth="60"  color="#4a8a2f" shadow="receive: true"></a-box>
      <a-box position=" 130 6 -280" width="70" height="16" depth="55"  color="#4a8a2f" shadow="receive: true"></a-box>
      <a-box position="-40  5 -350" width="100" height="12" depth="50" color="#4a8a2f" shadow="receive: true"></a-box>
    </a-entity>

    <!-- ==========================================================
         LEVEL 2 ENVIRONMENT — Sunset Canyon
    ========================================================== -->
    <a-entity id="env-l2" visible="false">
      <!-- Warm dusk lighting -->
      <a-light type="ambient"     color="#FF8C00" intensity="0.35"></a-light>
      <a-light type="directional" color="#FF4500" intensity="0.75"
               position="-1 0.4 -1"></a-light>
      <!-- Ground -->
      <a-plane id="ground-l2"
               position="0 0 -330" rotation="-90 0 0"
               width="400" height="750"
               shadow="receive: true"
               material="src: #tex-ground-l2; repeat: 40 80; roughness: 1.0">
      </a-plane>
      <!-- Canyon left wall -->
      <a-box position="-75 25 -330" width="30" height="55" depth="760"
             color="#8B4513" shadow="receive: true"></a-box>
      <!-- Canyon right wall -->
      <a-box position=" 75 25 -330" width="30" height="55" depth="760"
             color="#8B4513" shadow="receive: true"></a-box>
      <!-- Dusk glow horizon strip -->
      <a-plane position="0 0 -680" rotation="0 0 0" width="600" height="60"
               material="shader: flat; color: #FF4500; opacity: 0.35; transparent: true; side: double">
      </a-plane>
    </a-entity>

    <!-- ==========================================================
         BALLOON  (visual only — position synced to camera rig in JS)
    ========================================================== -->
    <a-entity id="balloon-entity" position="0 5 0">

      <!--
        BALLOON GEOMETRY LAYOUT (all positions relative to entity origin = camera eye)
        ─────────────────────────────────────────────────────────────────────────────
        Camera looks in  -Z  (forward).  FOV = 80° → ±40° vertical, ~±56° horizontal.

        Envelope  y=+4.0, z=0   → bottom edge at y=+2.65, directly overhead.
                                   Angle from -Z forward = 90°. Never in ±40° FOV.
                                   Player must look straight up to see it.

        Basket    y=-0.8, z=0   → top edge at y=-0.475, directly below.
                                   Angle from -Z forward = 90°. Never in ±40° FOV.
                                   Player glances down to see basket rim.

        Ropes     all at z ≥ 0  → behind or level with camera, never in forward view.
                                   Visible in peripheral left/right/back views only.
      -->

      <!--
        BALLOON GEOMETRY LAYOUT (positions relative to entity origin = camera eye)
        ──────────────────────────────────────────────────────────────────────────
        Camera looks in -Z. FOV ~80° → ±40° vertical, ±56° horizontal.

        Envelope  y=+3.5, z=+0.2  → sits overhead AND slightly BEHIND camera.
                                     Bottom edge at y≈+2.15 (above ±40° FOV).
                                     z=+0.2 pushes it into +Z (behind), well
                                     outside the forward -Z cone.

        Basket    y=-0.9, z=0, scale 0.5  → small, low; rim at y≈-0.575.
                                             Only visible on intentional downward look.

        Ropes     spread wide in X, offset to z≥+0.3 → peripheral sides/back only.
                  Angled outward so they never cross the forward -Z axis.

        Burner    y=-0.55 → below basket bottom, glows upward into basket gap.
      -->

      <!-- Envelope — overhead and slightly behind, clear of forward FOV -->
      <a-sphere id="balloon-envelope"
                position="0 3.5 0.2" radius="1.35"
                shadow="cast: true; receive: false"
                material="src: #tex-balloon; roughness: 0.55; metalness: 0.08">
        <a-cylinder position="0 0 0" radius="0.08" height="2.7"
                    material="shader: flat; color: #FFD700" rotation="0 0 0"></a-cylinder>
        <a-cylinder position="0 0 0" radius="0.08" height="2.7"
                    material="shader: flat; color: #FFD700" rotation="0 90 0"></a-cylinder>
        <a-cylinder position="0 0 0" radius="0.08" height="2.7"
                    material="shader: flat; color: #fff" rotation="0 45 0"></a-cylinder>
        <a-cylinder position="0 0 0" radius="0.08" height="2.7"
                    material="shader: flat; color: #fff" rotation="0 135 0"></a-cylinder>
      </a-sphere>

      <!-- Basket — small and low, only visible looking down -->
      <a-box id="balloon-basket"
             position="0 -0.9 0" scale="0.5 0.5 0.5"
             width="0.9" height="0.65" depth="0.9"
             shadow="cast: true; receive: false"
             material="src: #tex-basket; roughness: 1.0; metalness: 0.0">
      </a-box>

      <!--
        Suspension ropes — wide X spread, all z ≥ +0.3 (behind camera).
        Angled outward in X so they stay in far peripheral / back view.
        Radius 0.02 — very thin.
      -->
      <!-- Left rope -->
      <a-cylinder position="-0.7 1.3  0.3" radius="0.02" height="3.8"
                  color="#5c4a00" rotation="0 0  8"></a-cylinder>
      <!-- Right rope -->
      <a-cylinder position=" 0.7 1.3  0.3" radius="0.02" height="3.8"
                  color="#5c4a00" rotation="0 0 -8"></a-cylinder>
      <!-- Back-left rope -->
      <a-cylinder position="-0.5 1.3  0.7" radius="0.02" height="3.8"
                  color="#5c4a00" rotation="-6 0  5"></a-cylinder>
      <!-- Back-right rope -->
      <a-cylinder position=" 0.5 1.3  0.7" radius="0.02" height="3.8"
                  color="#5c4a00" rotation="-6 0 -5"></a-cylinder>

      <!-- Burner glow — below basket, glows upward -->
      <a-sphere id="balloon-burner"
                position="0 -0.55 0"
                radius="0.12"
                material="color: #ff6600; emissive: #ff4400; emissiveIntensity: 1.0;
                          opacity: 0.85; transparent: true; shader: flat">
      </a-sphere>
      <a-sphere position="0 -0.55 0"
                radius="0.22"
                material="color: #ff9900; emissive: #ff6600; emissiveIntensity: 0.6;
                          opacity: 0.25; transparent: true; shader: flat">
      </a-sphere>

    </a-entity>

    <!-- ==========================================================
         COLLECTIBLE / OBSTACLE CONTAINERS  (filled dynamically)
    ========================================================== -->
    <a-entity id="rings-container"></a-entity>
    <a-entity id="orbs-container"></a-entity>
    <a-entity id="clouds-container"></a-entity>
    <a-entity id="spires-container"></a-entity>

    <!-- ==========================================================
         CAMERA RIG  (this is what physically moves through the world)
    ========================================================== -->
    <a-entity id="camera-rig" position="0 5 0">

      <a-camera id="camera"
                look-controls="enabled: true; pointerLockEnabled: true; reverseMouseDrag: false"
                wasd-controls="enabled: false"
                fov="80"
                near="0.1" far="1200">

        <!-- ────────────────────────────────────────────────────
             GAZE CURSOR  (fuse-based — menus only)
             Raycasts only against .menu-btn planes.
             Disabled during gameplay via JS.
        ──────────────────────────────────────────────────────── -->
        <a-cursor id="gaze-cursor"
                  fuse="true"
                  fuse-timeout="1500"
                  raycaster="objects: .menu-btn; far: 5"
                  color="#FFD700"
                  opacity="0.9"
                  radius="0.012"
                  material="shader: flat">
        </a-cursor>

        <!-- ════════════════════════════════════════════════════
             HUD  (camera-parented — stays on-screen at all times,
             satisfying the rubric's "always-visible" requirement)
        ════════════════════════════════════════════════════ -->
        <a-entity id="hud" visible="false" position="0 0 -2.6">
          <!-- Top-bar backing strip -->
          <a-plane position="0 0.94 0" width="3.6" height="0.30"
                   material="shader: flat; color: #000; opacity: 0.45; transparent: true">
          </a-plane>
          <!-- Score (left) -->
          <a-text id="hud-score"
                  value="Score: 0"
                  position="-1.60 0.94 0.01"
                  align="left" color="#fff" width="1.9">
          </a-text>
          <!-- Level (centre) -->
          <a-text id="hud-level"
                  value="Level 1 · Sunny Meadows"
                  position="0 0.94 0.01"
                  align="center" color="#FFD700" width="2.0">
          </a-text>
          <!-- Personal best (right) -->
          <a-text id="hud-best"
                  value="Best: 0"
                  position="1.60 0.94 0.01"
                  align="right" color="#aaa" width="1.9">
          </a-text>
          <!-- Boundary warning (centre, below top bar) -->
          <a-text id="hud-boundary"
                  value=""
                  position="0 0.55 0.01"
                  align="center" color="#ff9900" width="2.4">
          </a-text>
        </a-entity>

        <!-- ════════════════════════════════════════════════════
             RED FLASH  (cloud-hit penalty — camera-parented so it
             fills the whole view regardless of look direction)
        ════════════════════════════════════════════════════ -->
        <a-entity id="hit-flash" visible="false">
          <a-plane position="0 0 -1.2" width="5" height="4"
                   material="shader: flat; color: #ff0000; opacity: 0.28;
                             transparent: true; side: double">
          </a-plane>
        </a-entity>

      </a-camera>
    </a-entity><!-- /camera-rig -->

    <!-- ==========================================================
         MENU PANELS — world-space, direct children of <a-scene>.
         Must NOT be camera children: the gaze cursor fires a ray
         from the camera's forward direction into the scene; if the
         panel is parented to the camera it rotates with the ray,
         so the ray never hits any button geometry.

         Flash + setup: static at player spawn (0 5 -2.6).
         Level-up + game-over: repositioned by placeWorldPanel()
         in JS so they appear in front of the balloon mid-flight.

         Panel rotation Y computed from camera forward vector so the
         front face (+Z normal) always points back toward the camera.
    ========================================================== -->

    <!-- ① FLASH SCREEN  (auto-advances after 5 s) -->
    <a-entity id="screen-flash" position="0 5 -2.6">
      <a-plane width="3.6" height="2.3"
               material="shader: flat; color: #000818; opacity: 0.97; transparent: true">
      </a-plane>
      <a-text value="SKY DRIFTER"
              position="0 0.75 0.02"
              align="center" color="#FFD700"
              width="4.2" font="kelsonsans">
      </a-text>
      <a-plane position="0 0.55 0.02" width="2.9" height="0.007"
               material="shader: flat; color: #FFD700; opacity: 0.8">
      </a-plane>
      <a-text value="CMPT 461 — Mobile VR"
              position="0 0.37 0.02"
              align="center" color="#aaddff" width="3.0">
      </a-text>
      <a-text value="Trinity Western University"
              position="0 0.19 0.02"
              align="center" color="#aaddff" width="3.0">
      </a-text>
      <!-- Student name  ← CHANGE THIS -->
      <a-text value="Shaurya Dewani"
              position="0 -0.04 0.02"
              align="center" color="#ffffff" width="3.4" font="kelsonsans">
      </a-text>
      <!-- Student ID  ← CHANGE THIS -->
      <a-text value="Student #: 647447"
              position="0 -0.26 0.02"
              align="center" color="#888" width="2.6">
      </a-text>
      <a-text id="flash-countdown"
              value="Continuing in 5…"
              position="0 -0.72 0.02"
              align="center" color="#FFD700" width="2.8">
      </a-text>
    </a-entity>

    <!-- ② SETUP SCREEN -->
    <a-entity id="screen-setup" visible="false" position="0 5 -2.6">
      <a-plane width="3.6" height="3.0"
               material="shader: flat; color: #000818; opacity: 0.97; transparent: true">
      </a-plane>
      <a-text value="SETTINGS"
              position="0 1.12 0.02"
              align="center" color="#FFD700" width="3.2" font="kelsonsans">
      </a-text>
      <a-text value="MUSIC"
              position="0 0.78 0.02"
              align="center" color="#aaddff" width="2.0">
      </a-text>
      <a-plane id="btn-mute"
               class="menu-btn"
               position="0 0.50 0.02"
               width="1.9" height="0.40"
               material="shader: flat; color: #1a3a6c; opacity: 1">
        <a-text id="lbl-mute"
                value="ON" position="0 0 0.01"
                align="center" color="#44ff88" width="2.2">
        </a-text>
      </a-plane>
      <a-text value="SENSITIVITY"
              position="0 0.08 0.02"
              align="center" color="#aaddff" width="2.0">
      </a-text>
      <a-plane id="btn-sens-dec"
               class="menu-btn"
               position="-0.78 -0.22 0.02"
               width="0.55" height="0.40"
               material="shader: flat; color: #1a3a6c">
        <a-text value="◀" position="0 0 0.01" align="center" color="#fff" width="0.8"></a-text>
      </a-plane>
      <a-text id="lbl-sens"
              value="Medium"
              position="0 -0.22 0.02"
              align="center" color="#FFD700" width="1.5">
      </a-text>
      <a-plane id="btn-sens-inc"
               class="menu-btn"
               position="0.78 -0.22 0.02"
               width="0.55" height="0.40"
               material="shader: flat; color: #1a3a6c">
        <a-text value="▶" position="0 0 0.01" align="center" color="#fff" width="0.8"></a-text>
      </a-plane>
      <a-text value="Tilt head left / right to steer&#xA;Look up / down to change altitude"
              position="0 -0.58 0.02"
              align="center" color="#667" width="2.9">
      </a-text>
      <a-text id="lbl-highscore"
              value="Best Score: 0"
              position="0 -0.86 0.02"
              align="center" color="#888" width="2.5">
      </a-text>
      <a-plane id="btn-start"
               class="menu-btn"
               position="0 -1.19 0.02"
               width="2.3" height="0.48"
               material="shader: flat; color: #1a7a1a">
        <a-text value="START GAME" position="0 0 0.01"
                align="center" color="#fff" width="2.8" font="kelsonsans">
        </a-text>
      </a-plane>
      <a-text value="Gaze at a button and hold 1.5 s to select"
              position="0 -1.48 0.02"
              align="center" color="#444" width="2.9">
      </a-text>
      <!-- iOS motion-permission denial message (hidden until needed) -->
      <a-text id="ios-perm-msg"
              value=""
              position="0 -1.72 0.02"
              align="center" color="#ff6644" width="2.9">
      </a-text>
    </a-entity>

    <!-- ③ LEVEL-UP OVERLAY (repositioned by placeWorldPanel in JS) -->
    <a-entity id="screen-levelup" visible="false" position="0 5 -2.6">
      <a-plane width="3.6" height="2.0"
               material="shader: flat; color: #000818; opacity: 0.93; transparent: true">
      </a-plane>
      <a-text value="LEVEL COMPLETE!"
              position="0 0.58 0.02"
              align="center" color="#FFD700" width="3.5" font="kelsonsans">
      </a-text>
      <a-text id="lu-score"
              value="Score: 0"
              position="0 0.18 0.02"
              align="center" color="#fff" width="2.6">
      </a-text>
      <a-text value="Entering Sunset Canyon…"
              position="0 -0.18 0.02"
              align="center" color="#aaddff" width="3.0">
      </a-text>
      <a-text id="lu-countdown"
              value="3"
              position="0 -0.62 0.02"
              align="center" color="#FFD700" width="2.0" font="kelsonsans">
      </a-text>
    </a-entity>

    <!-- ④ GAME-COMPLETE OVERLAY (repositioned by placeWorldPanel in JS) -->
    <a-entity id="screen-gameover" visible="false" position="0 5 -2.6">
      <a-plane width="3.6" height="3.2"
               material="shader: flat; color: #000818; opacity: 0.97; transparent: true">
      </a-plane>
      <!-- Title — set dynamically by gameOver() -->
      <a-text id="go-title"
              value="GAME COMPLETE!"
              position="0 1.18 0.02"
              align="center" color="#FFD700" width="3.8" font="kelsonsans">
      </a-text>
      <!-- Subtitle line -->
      <a-text id="go-subtitle"
              value="You conquered both levels!"
              position="0 0.84 0.02"
              align="center" color="#aaddff" width="3.0">
      </a-text>
      <!-- Horizontal rule -->
      <a-plane position="0 0.66 0.02" width="2.9" height="0.007"
               material="shader: flat; color: #FFD700; opacity: 0.6">
      </a-plane>
      <a-text id="go-score"
              value="Score: 0"
              position="0 0.46 0.02"
              align="center" color="#fff" width="2.8" font="kelsonsans">
      </a-text>
      <a-text id="go-best"
              value="Best: 0"
              position="0 0.18 0.02"
              align="center" color="#aaa" width="2.6">
      </a-text>
      <!-- NEW HIGH SCORE badge — shown only when beaten -->
      <a-text id="go-newbest"
              value=""
              position="0 -0.10 0.02"
              align="center" color="#44ff88" width="2.8" font="kelsonsans">
      </a-text>
      <a-plane id="btn-play-again"
               class="menu-btn"
               position="0 -0.58 0.02"
               width="2.3" height="0.46"
               material="shader: flat; color: #1a7a1a">
        <a-text value="PLAY AGAIN" position="0 0 0.01"
                align="center" color="#fff" width="2.8" font="kelsonsans">
        </a-text>
      </a-plane>
      <a-plane id="btn-to-setup"
               class="menu-btn"
               position="0 -1.14 0.02"
               width="2.3" height="0.40"
               material="shader: flat; color: #1a3a6c">
        <a-text value="SETTINGS" position="0 0 0.01"
                align="center" color="#aaa" width="2.2">
        </a-text>
      </a-plane>
      <a-text value="Gaze at a button and hold 1.5 s to select"
              position="0 -1.44 0.02"
              align="center" color="#444" width="2.9">
      </a-text>
    </a-entity>

  </a-scene><!-- /a-scene -->


  <!-- ==============================================================
       GAME SCRIPT
  ============================================================== -->
  <script>
'use strict';

/* ================================================================
   CONSTANTS
================================================================ */
// ── Speed tuning ──────────────────────────────────────────────────────────
// Increase to fly faster; decrease to slow down.  Units: world-m per ~16 ms tick.
const FWD_SPEED   = { 1: 0.11, 2: 0.17 };   // L1 = 0.11, L2 = 0.17

// ── Control tuning ────────────────────────────────────────────────────────
const MAX_CLIMB   = 0.075;  // max world-units/tick altitude change
const ALT_MIN     = 1.5;
const ALT_MAX     = 38;

// ── World boundary constants ──────────────────────────────────────────────
// X/Z limits keep the player inside the playfield and the sky sphere.
// WORLD_Z_MIN is computed per-level in the tick: -(depth + 100).
const WORLD_X_MIN = -150;
const WORLD_X_MAX =  150;
const WORLD_Z_MAX =   50;   // can't fly backward past spawn point

const RING_SCORE  = 10;
const ORB_SCORE   = 5;
const CLOUD_PEN   = 15;
const RING_R      = 3.5;    // pass-through radius (XY distance)
const ORB_R       = 2.1;    // collect radius
const CLOUD_R     = 3.6;    // penalty trigger radius

const SENS_VALUES = [0.35, 0.65, 1.0, 1.40, 1.85];
const SENS_LABELS = ['Very Low', 'Low', 'Medium', 'High', 'Very High'];

const LEVEL_CFG = {
  1: { rings: 20, orbs: 28, clouds: 14, depth: 530, ringColor: '#FFD700', orbColor: '#00ffcc', cloudColor: '#eeeef5' },
  2: { rings: 26, orbs: 35, clouds: 22, depth: 660, ringColor: '#FF6347', orbColor: '#ffaa00', cloudColor: '#cc7755' }
};

const LEVEL_NAMES = { 1: 'Sunny Meadows', 2: 'Sunset Canyon' };
const LEVEL_SKY   = { 1: '#tex-sky-l1',   2: '#tex-sky-l2'   };

/* ================================================================
   STATE
================================================================ */
let gameState    = 'flash';   // flash | setup | playing | levelup | gameover
let level        = 1;
let score        = 0;
let sensIdx      = 2;
let musicMuted   = false;
let highScore    = parseInt(localStorage.getItem('skyDrifterHigh') || '0', 10);

// Balloon world-space position
const bPos = { x: 0, y: 5, z: 0 };
let boundaryNudge    = 0;   // frames remaining to nudge balloon back from world edge
let groundHitCooldown = 0;  // ms timestamp after which ground-hit can trigger again

// Active objects: {el, x, y, z, used, penalized}
let rings  = [];
let orbs   = [];
let clouds = [];

/* ================================================================
   DOM ELEMENT REFERENCES
================================================================ */
const sceneEl       = document.getElementById('main-scene');
const rigEl         = document.getElementById('camera-rig');
const cameraEl      = document.getElementById('camera');
const balloonEl     = document.getElementById('balloon-entity');
const cursorEl      = document.getElementById('gaze-cursor');

const envL1         = document.getElementById('env-l1');
const envL2         = document.getElementById('env-l2');
const skyEl         = document.getElementById('sky');
const ringsCtEl     = document.getElementById('rings-container');
const orbsCtEl      = document.getElementById('orbs-container');
const cloudsCtEl    = document.getElementById('clouds-container');
const spiresCtEl    = document.getElementById('spires-container');

const sFlash        = document.getElementById('screen-flash');
const sSetup        = document.getElementById('screen-setup');
const sHUD          = document.getElementById('hud');
const sLevelup      = document.getElementById('screen-levelup');
const sGameover     = document.getElementById('screen-gameover');
const hitFlashEl    = document.getElementById('hit-flash');

const flashCountEl  = document.getElementById('flash-countdown');
const lblMute       = document.getElementById('lbl-mute');
const lblSens       = document.getElementById('lbl-sens');
const lblHighscore  = document.getElementById('lbl-highscore');
const hudScoreEl    = document.getElementById('hud-score');
const hudLevelEl    = document.getElementById('hud-level');
const hudBestEl     = document.getElementById('hud-best');
const hudBoundaryEl = document.getElementById('hud-boundary');
const luScoreEl     = document.getElementById('lu-score');
const luCountEl     = document.getElementById('lu-countdown');
const goTitleEl     = document.getElementById('go-title');
const goSubtitleEl  = document.getElementById('go-subtitle');
const goScoreEl     = document.getElementById('go-score');
const goBestEl      = document.getElementById('go-best');
const goNewBestEl   = document.getElementById('go-newbest');

/* ================================================================
   AUDIO HELPERS
================================================================ */
function playMusic(id) {
  if (musicMuted) return;
  const el = document.getElementById(id);
  if (!el) return;
  el.currentTime = 0;
  el.play().catch(() => {});
}
function stopAllMusic() {
  ['aud-music-l1', 'aud-music-l2'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.pause(); el.currentTime = 0; }
  });
}
function playSFX(id) {
  // SFX always plays even when music is muted (rubric: music mutable, SFX separate)
  const el = document.getElementById(id);
  if (!el) return;
  el.currentTime = 0;
  el.play().catch(() => {});
}

/* ================================================================
   SCREEN MANAGER
================================================================ */
const ALL_SCREENS = () => [sFlash, sSetup, sHUD, sLevelup, sGameover];

function showScreens(...active) {
  ALL_SCREENS().forEach(s => s && s.setAttribute('visible', 'false'));
  active.forEach(s => s && s.setAttribute('visible', 'true'));
}

/* ================================================================
   FLASH SCREEN  (shows credentials, auto-advances after 5 s)
================================================================ */
let flashTimerId = null;

function startFlash() {
  gameState = 'flash';
  cursorEl.setAttribute('visible', 'false');
  showScreens(sFlash);
  let t = 5;
  flashCountEl.setAttribute('text', 'value', `Continuing in ${t}…`);
  flashTimerId = setInterval(() => {
    t--;
    if (t > 0) {
      flashCountEl.setAttribute('text', 'value', `Continuing in ${t}…`);
    } else {
      clearInterval(flashTimerId);
      startSetup();
    }
  }, 1000);
}

/* ================================================================
   SETUP SCREEN
================================================================ */
function startSetup() {
  gameState = 'setup';
  stopAllMusic();
  // Reset balloon to spawn so the world-space setup panel at (0 5 -2.6) is in front
  bPos.x = 0; bPos.y = 5; bPos.z = 0;
  rigEl.object3D.position.set(0, 5, 0);
  balloonEl.object3D.position.set(0, 5, 0);
  showScreens(sSetup);
  cursorEl.setAttribute('visible', 'true');
  refreshSetupUI();
}

function refreshSetupUI() {
  lblMute.setAttribute('text', 'value', musicMuted ? 'OFF' : 'ON');
  lblMute.setAttribute('text', 'color', musicMuted ? '#ff6666' : '#44ff88');
  document.getElementById('btn-mute')
          .setAttribute('material', `shader: flat; color: ${musicMuted ? '#4a1a1a' : '#1a3a6c'}`);
  lblSens.setAttribute('text', 'value', SENS_LABELS[sensIdx]);
  lblHighscore.setAttribute('text', 'value', `Best Score: ${highScore}`);
}

/* ================================================================
   OBJECT SPAWNING
================================================================ */
function rnd(min, max) { return min + Math.random() * (max - min); }

function clearObjects() {
  rings = []; orbs = []; clouds = [];
  [ringsCtEl, orbsCtEl, cloudsCtEl, spiresCtEl].forEach(ct => {
    while (ct.firstChild) ct.removeChild(ct.firstChild);
  });
}

function makeRing(x, y, z, color) {
  const el = document.createElement('a-torus');
  el.setAttribute('position', `${x} ${y} ${z}`);
  el.setAttribute('radius', '3.5');
  el.setAttribute('radius-tubular', '0.28');
  el.setAttribute('rotation', `${rnd(-12,12)} ${rnd(-18,18)} 0`);
  el.setAttribute('material', `src: #tex-ring; emissive: ${color}; emissiveIntensity: 0.35; roughness: 0.3`);
  return el;
}

function makeOrb(x, y, z, color) {
  const el = document.createElement('a-sphere');
  el.setAttribute('position', `${x} ${y} ${z}`);
  el.setAttribute('radius', '0.68');
  el.setAttribute('material', `src: #tex-orb; emissive: ${color}; emissiveIntensity: 0.85; roughness: 0.15`);
  return el;
}

function makeCloud(x, y, z, color) {
  const grp = document.createElement('a-entity');
  grp.setAttribute('position', `${x} ${y} ${z}`);
  // Cloud = 4 overlapping spheres
  [[0,0,0, 3.3],[2.1,0.5,0.2, 2.7],[-2.0,0.3,-0.3, 2.5],[0.4,-0.3,1.4, 2.1]].forEach(
    ([cx,cy,cz,cr]) => {
      const s = document.createElement('a-sphere');
      s.setAttribute('position', `${cx} ${cy} ${cz}`);
      s.setAttribute('radius', `${cr}`);
      // src: black-bg cloud map; alphaTest cuts hard black edges,
      // blending: additive softens any remaining dark fringe.
      s.setAttribute('material',
        `src: #tex-cloud; color: ${color};` +
        ' alphaTest: 0.5; blending: additive; transparent: true; roughness: 1.0; depthWrite: false');
      grp.appendChild(s);
    }
  );
  return grp;
}

function spawnObjects(lvl) {
  const cfg   = LEVEL_CFG[lvl];
  const depth = cfg.depth;

  // Separation clearance: ring/orb must be at least this far from any cloud
  const SEP = CLOUD_R + RING_R + 5;   // ~12 units

  // Helper: true if (x,y,z) is too close to any already-placed cloud
  function tooCloseToCloud(x, y, z) {
    return clouds.some(c => dist3(x, y, z, c.x, c.y, c.z) < SEP);
  }

  // ── Clouds first — so rings/orbs can check against them ──────────
  for (let i = 0; i < cfg.clouds; i++) {
    const z  = rnd(-40, -depth);
    const x  = rnd(-22, 22);
    const y  = rnd(7, 24);
    const el = makeCloud(x, y, z, cfg.cloudColor);
    cloudsCtEl.appendChild(el);
    clouds.push({ el, x, y, z, penalized: false });
  }

  // ── Rings — evenly spaced in Z, random XY with cloud separation ──
  // Altitude clamped to [ALT_MIN+4, ALT_MAX-4] so rings never clip
  // into the ground or the sky ceiling.
  const RING_Y_MIN = ALT_MIN + 4;   // 5.5
  const RING_Y_MAX = ALT_MAX - 4;   // 34
  for (let i = 0; i < cfg.rings; i++) {
    const z = -30 - i * (depth / cfg.rings);
    let x = rnd(-14, 14);
    let y = rnd(RING_Y_MIN, RING_Y_MAX);
    // Retry up to 20 times to find a cloud-clear position
    for (let attempt = 0; attempt < 20 && tooCloseToCloud(x, y, z); attempt++) {
      x = rnd(-14, 14);
      y = rnd(RING_Y_MIN, RING_Y_MAX);
    }
    const el = makeRing(x, y, z, cfg.ringColor);
    ringsCtEl.appendChild(el);
    rings.push({ el, x, y, z, used: false });
  }

  // ── Orbs — scattered randomly with cloud separation ───────────────
  const ORB_Y_MIN = ALT_MIN + 4;   // 5.5
  const ORB_Y_MAX = ALT_MAX - 4;   // 34
  for (let i = 0; i < cfg.orbs; i++) {
    let z = rnd(-25, -depth);
    let x = rnd(-18, 18);
    let y = rnd(ORB_Y_MIN, ORB_Y_MAX);
    for (let attempt = 0; attempt < 20 && tooCloseToCloud(x, y, z); attempt++) {
      z = rnd(-25, -depth);
      x = rnd(-18, 18);
      y = rnd(ORB_Y_MIN, ORB_Y_MAX);
    }
    const el = makeOrb(x, y, z, cfg.orbColor);
    orbsCtEl.appendChild(el);
    orbs.push({ el, x, y, z, used: false });
  }

  // Level 2 only: rock spires lining canyon floor
  if (lvl === 2) {
    for (let i = 0; i < 14; i++) {
      const z  = rnd(-40, -depth);
      const sx = (Math.random() < 0.5 ? -1 : 1) * rnd(14, 30);
      const h  = rnd(16, 48);
      const sp = document.createElement('a-entity');
      sp.setAttribute('position', `${sx} 0 ${z}`);
      const body = document.createElement('a-cylinder');
      body.setAttribute('position', `0 ${h * 0.5} 0`);
      body.setAttribute('radius-bottom', `${rnd(1.5, 3.8)}`);
      body.setAttribute('radius-top',    `${rnd(0.1, 0.9)}`);
      body.setAttribute('height', `${h}`);
      body.setAttribute('color', '#7a3822');
      body.setAttribute('material', 'roughness: 1.0');
      sp.appendChild(body);
      spiresCtEl.appendChild(sp);
    }
  }
}

/* ================================================================
   LEVEL START
================================================================ */
function startLevel(lvl) {
  level    = lvl;
  gameState = 'playing';

  // Reset balloon to start position
  bPos.x = 0; bPos.y = 5; bPos.z = 0;
  const posStr = '0 5 0';
  rigEl.setAttribute('position', posStr);
  balloonEl.setAttribute('position', posStr);
  balloonEl.setAttribute('rotation', '0 0 0');

  // Swap environment
  skyEl.setAttribute('src', LEVEL_SKY[lvl]);
  envL1.setAttribute('visible', lvl === 1 ? 'true' : 'false');
  envL2.setAttribute('visible', lvl === 2 ? 'true' : 'false');

  // Spawn objects for this level
  clearObjects();
  spawnObjects(lvl);

  // Show HUD, hide menus, disable cursor
  showScreens(sHUD);
  hitFlashEl.setAttribute('visible', 'false');
  cursorEl.setAttribute('visible', 'false');
  updateHUD();

  // Music
  stopAllMusic();
  playMusic(lvl === 1 ? 'aud-music-l1' : 'aud-music-l2');
}

/* ================================================================
   LEVEL COMPLETE
================================================================ */
let luTimer = null;

// Place a world-space menu panel 2.6 m in front of the balloon's current
// position, rotated so its front face (+Z normal) points back at the camera.
// Called for level-up and game-over panels that appear mid-flight.
function placeWorldPanel(el) {
  // Place panel 2.6 m in front of where the camera is currently looking (XZ only)
  const q = new THREE.Quaternion();
  cameraEl.object3D.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  fwd.y = 0;
  if (fwd.lengthSq() > 0.0001) fwd.normalize();
  const px = bPos.x + fwd.x * 2.6;
  const py = bPos.y;
  const pz = bPos.z + fwd.z * 2.6;
  el.setAttribute('position', `${px.toFixed(2)} ${py.toFixed(2)} ${pz.toFixed(2)}`);
  // Rotate panel to face back toward camera
  const yDeg = THREE.MathUtils.radToDeg(Math.atan2(-fwd.x, -fwd.z));
  el.setAttribute('rotation', `0 ${yDeg.toFixed(1)} 0`);
}

function levelComplete() {
  if (gameState !== 'playing') return;
  gameState = 'levelup';
  stopAllMusic();
  playSFX('aud-sfx-level');
  luScoreEl.setAttribute('text', 'value', `Score: ${score}`);
  placeWorldPanel(sLevelup);
  showScreens(sHUD, sLevelup);   // keep HUD visible behind overlay
  let t = 3;
  luCountEl.setAttribute('text', 'value', String(t));
  luTimer = setInterval(() => {
    t--;
    if (t > 0) {
      luCountEl.setAttribute('text', 'value', String(t));
    } else {
      clearInterval(luTimer);
      sLevelup.setAttribute('visible', 'false');
      startLevel(2);
    }
  }, 1000);
}

/* ================================================================
   GAME OVER  (called after level 2 end, or can be extended for
               health system)
================================================================ */
function gameOver() {
  if (gameState === 'gameover') return;
  gameState = 'gameover';
  stopAllMusic();

  const isNewBest = score > highScore;
  if (isNewBest) {
    highScore = score;
    localStorage.setItem('skyDrifterHigh', String(highScore));
  }

  // Title + subtitle — always a "game complete" because the only way to reach
  // gameOver() is by flying past Level 2's depth boundary in the tick.
  goTitleEl.setAttribute('text',    'value: GAME COMPLETE!; color: #FFD700');
  goSubtitleEl.setAttribute('text', 'value: You conquered both levels!; color: #aaddff');

  goScoreEl.setAttribute('text',   'value', `Final Score: ${score}`);
  goBestEl.setAttribute('text',    'value', `Personal Best: ${highScore}`);
  goNewBestEl.setAttribute('text', 'value', isNewBest ? '★  NEW HIGH SCORE!  ★' : '');

  playSFX('aud-sfx-level');   // celebratory chime on completion

  placeWorldPanel(sGameover);
  showScreens(sGameover);     // hides HUD; shows gameover panel
  cursorEl.setAttribute('visible', 'true');
}

/* ================================================================
   HUD UPDATE
================================================================ */
function updateHUD() {
  hudScoreEl.setAttribute('text', 'value', `Score: ${score}`);
  hudLevelEl.setAttribute('text', 'value', `Level ${level} · ${LEVEL_NAMES[level]}`);
  hudBestEl.setAttribute('text', 'value',  `Best: ${highScore}`);
}

/* ================================================================
   COLLISION DETECTION  (called every tick during gameplay)
================================================================ */
let hitFlashTimer = null;

function showHitFlash() {
  hitFlashEl.setAttribute('visible', 'true');
  if (hitFlashTimer) clearTimeout(hitFlashTimer);
  hitFlashTimer = setTimeout(() => hitFlashEl.setAttribute('visible', 'false'), 380);
}

function dist3(ax,ay,az, bx,by,bz) {
  const dx=ax-bx, dy=ay-by, dz=az-bz;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

// Checks whether 65% of rings are cleared to advance to next level
function checkAdvance() {
  if (level === 1) {
    const cleared = rings.filter(r => r.used).length;
    if (cleared >= Math.ceil(LEVEL_CFG[1].rings * 0.65)) {
      levelComplete();
    }
  }
}

function checkCollisions() {
  const { x: bx, y: by, z: bz } = bPos;

  // ── Rings ──────────────────────────────────────────────────────
  for (const r of rings) {
    if (r.used) continue;
    const dz = bz - r.z;
    // Only check when balloon is within 1.8 units of ring plane (Z axis)
    if (Math.abs(dz) < 1.8) {
      const dxy = Math.sqrt((bx-r.x)**2 + (by-r.y)**2);
      if (dxy < RING_R) {
        r.used = true;
        r.el.setAttribute('visible', 'false');
        score += RING_SCORE;
        playSFX('aud-sfx-ring');
        updateHUD();
        checkAdvance();
      }
    }
  }

  // ── Orbs ───────────────────────────────────────────────────────
  for (const o of orbs) {
    if (o.used) continue;
    if (dist3(bx,by,bz, o.x,o.y,o.z) < ORB_R) {
      o.used = true;
      o.el.setAttribute('visible', 'false');
      score += ORB_SCORE;
      playSFX('aud-sfx-orb');
      updateHUD();
    }
  }

  // ── Clouds (penalty, 2 s cooldown per cloud) ───────────────────
  // playSFX() already null-checks the element; the outer try/catch
  // ensures a missing audio file never silently swallows the score/flash.
  for (const c of clouds) {
    if (c.penalized) continue;
    if (dist3(bx,by,bz, c.x,c.y,c.z) < CLOUD_R) {
      c.penalized = true;
      try {
        score = Math.max(0, score - CLOUD_PEN);
        playSFX('aud-sfx-cloud');
        updateHUD();
        showHitFlash();
      } catch(e) {
        console.warn('Cloud collision handler error:', e);
      }
      setTimeout(() => { c.penalized = false; }, 2000);
    }
  }
}

/* ================================================================
   A-FRAME GAME-TICK COMPONENT
   Registered on the scene element and called every render frame.
================================================================ */
AFRAME.registerComponent('game-tick', {
  tick(time, delta) {
    if (gameState !== 'playing') return;

    // Clamp delta to avoid huge jumps after tab-switching
    const dt = Math.min(delta / 16.67, 3.0);

    // ── Get camera world forward vector ──────────────────────────
    const camWorldQuat = new THREE.Quaternion();
    cameraEl.object3D.getWorldQuaternion(camWorldQuat);
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camWorldQuat);

    // ── Forward movement (XZ plane only) ─────────────────────────
    const flat = new THREE.Vector3(forward.x, 0, forward.z);
    if (flat.lengthSq() > 0.0001) flat.normalize();
    const speed = FWD_SPEED[level] * dt;
    bPos.x += flat.x * speed;
    bPos.z += flat.z * speed;

    // ── Altitude from look pitch ──────────────────────────────────
    // forward.y is +1 looking straight up, -1 straight down.
    // Deadzone of 0.1 (~6°) prevents drift on flat look.
    const pitch = forward.y;
    if (Math.abs(pitch) > 0.1) {
      const sens = SENS_VALUES[sensIdx];
      bPos.y += (pitch - Math.sign(pitch) * 0.1) * MAX_CLIMB * sens * dt;
      bPos.y = Math.max(ALT_MIN, Math.min(ALT_MAX, bPos.y));
    }

    // ── Ground collision ─────────────────────────────────────────
    // Trigger when the balloon dips to within 0.5 units of ALT_MIN.
    // 2-second cooldown (stored as an absolute timestamp) prevents
    // the penalty firing every frame while the player is near the floor.
    if (bPos.y <= ALT_MIN + 0.5 && time > groundHitCooldown) {
      groundHitCooldown = time + 2000;
      score = Math.max(0, score - CLOUD_PEN);
      playSFX('aud-sfx-cloud');
      updateHUD();
      showHitFlash();
      bPos.y = ALT_MIN + 5;   // bounce back up so player can recover
    }

    // ── World boundary clamping ───────────────────────────────────
    const WORLD_Z_MIN = -(LEVEL_CFG[level].depth + 100);
    let hitBoundary = false;
    if (bPos.x < WORLD_X_MIN) { bPos.x = WORLD_X_MIN; hitBoundary = true; }
    if (bPos.x > WORLD_X_MAX) { bPos.x = WORLD_X_MAX; hitBoundary = true; }
    if (bPos.z > WORLD_Z_MAX) { bPos.z = WORLD_Z_MAX; hitBoundary = true; }
    if (bPos.z < WORLD_Z_MIN) { bPos.z = WORLD_Z_MIN; hitBoundary = true; }

    if (hitBoundary) {
      boundaryNudge = 90;   // ~1.5 s at 60 fps
      hudBoundaryEl.setAttribute('text', 'value', 'Turning back…');
    }
    if (boundaryNudge > 0) {
      // Gently pull X toward centre, Z toward mid-level depth
      bPos.x += (0 - bPos.x) * 0.018;
      bPos.z += (-(LEVEL_CFG[level].depth * 0.5) - bPos.z) * 0.008;
      boundaryNudge--;
      if (boundaryNudge === 0) {
        hudBoundaryEl.setAttribute('text', 'value', '');
      }
    }

    // ── Sync transforms ──────────────────────────────────────────
    rigEl.object3D.position.set(bPos.x, bPos.y, bPos.z);
    balloonEl.object3D.position.set(bPos.x, bPos.y, bPos.z);
    // Orient balloon visual to match flat flight direction
    balloonEl.object3D.rotation.y = Math.atan2(flat.x, -flat.z);

    // ── Sky follows camera so player never reaches the sphere edge ─
    skyEl.object3D.position.set(bPos.x, bPos.y, bPos.z);

    // ── Gentle idle sway on envelope ─────────────────────────────
    const sway = Math.sin(time * 0.0009) * 1.2;
    const envelopeEl = document.getElementById('balloon-envelope');
    if (envelopeEl) envelopeEl.object3D.rotation.z = THREE.MathUtils.degToRad(sway);

    // ── Collisions ───────────────────────────────────────────────
    checkCollisions();

    // ── Level completion ─────────────────────────────────────────
    // L1: flying past depth triggers level-up to L2
    if (level === 1 && -bPos.z > LEVEL_CFG[1].depth + 60) {
      levelComplete();
    }
    // L2: flying past depth ends the game
    if (level === 2 && -bPos.z > LEVEL_CFG[2].depth + 60) {
      gameOver();
    }
  }
});

/* ================================================================
   BUTTON HANDLERS
================================================================ */
function wireButtons() {
  // ── Mute toggle ──────────────────────────────────────────────
  document.getElementById('btn-mute').addEventListener('click', () => {
    if (gameState !== 'setup') return;
    musicMuted = !musicMuted;
    refreshSetupUI();
  });

  // ── Sensitivity decrease ─────────────────────────────────────
  document.getElementById('btn-sens-dec').addEventListener('click', () => {
    if (gameState !== 'setup') return;
    sensIdx = Math.max(0, sensIdx - 1);
    refreshSetupUI();
  });

  // ── Sensitivity increase ─────────────────────────────────────
  document.getElementById('btn-sens-inc').addEventListener('click', () => {
    if (gameState !== 'setup') return;
    sensIdx = Math.min(SENS_VALUES.length - 1, sensIdx + 1);
    refreshSetupUI();
  });

  // ── Start game (iOS 13+ motion-permission gate) ───────────────
  //
  // iOS 13+ silently returns zero for DeviceOrientationEvent unless the
  // page calls DeviceOrientationEvent.requestPermission() from inside a
  // user-gesture handler (which a gaze-fuse click qualifies as).
  //
  // Decision tree:
  //   • API exists (iOS 13+) → request permission
  //       granted  → launch game
  //       denied   → stay on setup screen, show inline error message
  //       error    → fall back to launch (shouldn't happen in practice)
  //   • API absent (Android, desktop, iOS ≤ 12) → launch directly
  //     The existing mouse-drag look-controls are unaffected either way.
  document.getElementById('btn-start').addEventListener('click', () => {
    if (gameState !== 'setup') return;

    function launchGame() {
      // Clear any previous denial message before entering gameplay
      document.getElementById('ios-perm-msg').setAttribute('text', 'value', '');
      score = 0;
      startLevel(1);
    }

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      // ── iOS 13+ path ─────────────────────────────────────────
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            launchGame();
          } else {
            // User tapped "Don't Allow" — surface a clear message and stay
            document.getElementById('ios-perm-msg').setAttribute(
              'text', 'value',
              'Motion access denied.\nReload the page and tap Allow to play.'
            );
          }
        })
        .catch(err => {
          // requestPermission threw unexpectedly — log and fall through
          console.warn('DeviceOrientationEvent.requestPermission() error:', err);
          launchGame();
        });
    } else {
      // ── Android / desktop / iOS ≤ 12 path ────────────────────
      launchGame();
    }
  });

  // ── Play again ───────────────────────────────────────────────
  document.getElementById('btn-play-again').addEventListener('click', () => {
    if (gameState !== 'gameover') return;
    score = 0;
    startLevel(1);
  });

  // ── Back to settings ─────────────────────────────────────────
  document.getElementById('btn-to-setup').addEventListener('click', () => {
    if (gameState !== 'gameover') return;
    startSetup();
  });
}

/* ================================================================
   BOOT
================================================================ */
function boot() {
  if (boot.done) return;   // idempotent — whichever path fires first wins
  boot.done = true;

  sceneEl.setAttribute('game-tick', '');
  wireButtons();

  const loadDiv = document.getElementById('loading-screen');
  loadDiv.classList.add('fade-out');
  setTimeout(() => loadDiv.style.display = 'none', 700);

  startFlash();
}

sceneEl.addEventListener('loaded', boot);

// Fallback: if the 'loaded' event never fires (anime.js crash, asset timeout,
// or any other init failure), force-boot after 5 s so the game is never
// permanently stuck on a black screen.
setTimeout(() => {
  if (!boot.done) {
    console.warn('Sky Drifter: a-scene "loaded" event did not fire within 5 s — forcing boot.');
    boot();
  }
}, 5000);

/* ================================================================
   MOBILE: unlock audio on first touch (browsers require a gesture)
================================================================ */
document.addEventListener('touchend', function unlockAudio() {
  ['aud-music-l1','aud-music-l2','aud-sfx-ring','aud-sfx-orb',
   'aud-sfx-cloud','aud-sfx-level'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.play().then(() => el.pause()).catch(() => {});
  });
  document.removeEventListener('touchend', unlockAudio);
}, { once: true });
  </script>
